global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  60s

frontend http_in
    bind *:80
    default_backend osrm_driving

    # OSRM profile routing
    acl is_driving  path_beg /route/v1/driving
    acl is_walking  path_beg /route/v1/walking
    acl is_cycling  path_beg /route/v1/cycling

    # Postcodes routing
    acl is_postcodes  path_beg /postcodes
    acl is_outcodes   path_beg /outcodes

    use_backend osrm_driving  if is_driving
    use_backend osrm_walking  if is_walking
    use_backend osrm_cycling  if is_cycling
    use_backend postcodes_api if is_postcodes
    use_backend postcodes_api if is_outcodes

backend osrm_driving
    server driving osrm-backend-driving:5000 check

backend osrm_walking
    server walking osrm-backend-walking:5000 check

backend osrm_cycling
    server cycling osrm-backend-cycling:5000 check

backend postcodes_api
    server postcodes postcodes-api:8000 check
