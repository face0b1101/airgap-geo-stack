[project]
name = "airgap-geo-stack"
version = "1.0.0"
description = "Self-contained Python library and Docker Compose stack for fully air-gapped geocoding, reverse geocoding, routing, and UK postcode lookup"
readme = "README.md"
authors = [
    { name = "face0b1101", email = "6190957+face0b1101@users.noreply.github.com" },
]
maintainers = [
    { name = "face0b1101", email = "6190957+face0b1101@users.noreply.github.com" },
]
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "cachetools>=7.0.1",
    "fastapi>=0.134.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "python-decouple>=3.8",
    "uvicorn[standard]>=0.41.0",
]

[project.urls]
Homepage = "https://github.com/face0b1101/airgap-geo-stack"
Documentation = "https://github.com/face0b1101/airgap-geo-stack"
Repository = "https://github.com/face0b1101/airgap-geo-stack"
"Bug Tracker" = "https://github.com/face0b1101/airgap-geo-stack/issues"
Changelog = "https://github.com/face0b1101/airgap-geo-stack/blob/main/CHANGELOG.md"

[project.scripts]
serve = "airgap_geo_api.app:create_app"

[tool.hatch.build.targets.wheel]
packages = ["src/airgap_geo", "src/airgap_geo_api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
include = ["*.py", "*.pyi", "**/pyproject.toml"]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = ["E203", "E266", "E501", "F403", "F401"]
extend-select = [
    "D",   # pydocstyle
    "E",
    "W",   # pycodestyle
    "F",   # Pyflakes
    "I",   # sort imports
    "UP",  # pyupgrade
    "Q",   # flake8-quotes
    "B",   # flake8-bugbear
    "B9",  # flake8-bugbear "more opinionated" checks
    "SIM", # flake8-simplify
    "C90", # more complexity rules
    "RUF", # ruff dev rules
]

[tool.ruff.lint.mccabe]
# Unlike Flake8, defaults to a complexity level of 10.
max-complexity = 18

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "folium>=0.20.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.5",
    "pandas>=3.0.1",
    "pre-commit>=3.8.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.6.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
