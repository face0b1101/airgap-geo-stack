[project]
name = "python-uv-boilerplate"
version = "0.3.0"
description = "Boilerplate template for creating basic python projects with uv"
readme = "README.md"
authors = [
    { name = "face0b1101", email = "6190957+face0b1101@users.noreply.github.com" },
]
maintainers = [
    { name = "face0b1101", email = "6190957+face0b1101@users.noreply.github.com" },
]
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "python-decouple>=3.8",
    "rich>=13.8.1",
    "tqdm>=4.66.5",
    "unipath>=1.1",
]

[project.urls]
Homepage = "https://github.com/face0b1101/python-uv-boilerplate"
Documentation = "https://github.com/face0b1101/python-uv-boilerplate"
Repository = "https://github.com/face0b1101/python-uv-boilerplate"
"Bug Tracker" = "https://github.com/face0b1101/python-uv-boilerplate/issues"
Changelog = "https://github.com/face0b1101/python-uv-boilerplate/blob/master/CHANGELOG.md"

[project.scripts]
hello = "python_uv_boilerplate.main:hello"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
include = ["*.py", "*.pyi", "*.ipynb", "**/pyproject.toml"]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = ["E203", "E266", "E501", "F403", "F401"]
extend-select = [
    "D",   # pydocstyle
    "E",
    "W",   # pycodestyle
    "F",   # Pyflakes
    "I",   # sort imports
    "UP",  # pyupgrade
    "Q",   # flake8-quotes
    "B",   # flake8-bugbear
    "B9",  # flake8-bugbear "more opinionated" checks
    "SIM", # flake8-simplify
    "C90", # more complexity rules
    "RUF", # ruff dev rules
]

[tool.ruff.lint.mccabe]
# Unlike Flake8, defaults to a complexity level of 10.
max-complexity = 18

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = ["jupyter>=1.1.1", "pre-commit>=3.8.0", "pytest>=8.3.3", "ruff>=0.6.8"]
